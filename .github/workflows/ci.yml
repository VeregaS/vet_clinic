name: VetClinic checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Style and file checks
        run: |
          pip install pre-commit==4.2.0
          pre-commit run --all-files
      - name: Set up disposable environment
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=$/SECRET_KEY=$(openssl rand -hex 32)/;s/^DB_PASSWORD=$/DB_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Audit Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit --no-deps --disable-pip -r requirements.txt
      - name: Build
        run: docker compose build web
      - name: Check and migrate
        run: |
          docker compose up -d --wait db
          docker compose run --rm web python manage.py check
          docker compose run --rm web python manage.py makemigrations --check --dry-run
          docker compose run --rm web python manage.py migrate
          docker compose run --rm web python manage.py seed_demo
      - name: PostgreSQL tests and PDF
        run: docker compose run --rm web python manage.py test clinic -v 2
