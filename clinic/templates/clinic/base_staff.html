{% load static %}
<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет — Доктор Котов</title>
<link rel="stylesheet" href="{% static 'clinic/css/style.css' %}">
<link rel="stylesheet" href="{% static 'clinic/css/staff.css' %}">
<script defer src="{% static 'clinic/js/nav.js' %}"></script></head><body class="staff">
<header class="masthead"><span class="hero-title clinic-brand">{% include "clinic/brand.html" %}</span>
<nav aria-label="Кабинет врача">
<a {% if request.resolver_match.url_name == 'doctor_dashboard' or request.resolver_match.url_name == 'appointment_edit' %}aria-current="page"{% endif %} href="{% url 'doctor_dashboard' %}">Расписание</a>
<a {% if 'patient' in request.resolver_match.url_name %}aria-current="page"{% endif %} href="{% url 'patient_list' %}">Пациенты</a>
{% if perms.clinic.manage_clinic %}<a {% if request.resolver_match.url_name == 'doctor_add' %}aria-current="page"{% endif %} href="{% url 'doctor_add' %}">Добавить врача</a>{% endif %}
</nav><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="exit">Выйти</button></form></header>
<main class="desk">{% block content %}{% endblock %}</main></body></html>
